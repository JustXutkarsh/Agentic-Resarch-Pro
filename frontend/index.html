<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23315BFF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>✦ AGENTIC RESEARCH — Autonomous Research Instrument</title>
    <meta name="description" content="Autonomous agentic research instrument featuring iterative evidence retrieval, contradiction detection, and publication-grade research synthesis." />

    <!-- Synchronous Theme Initialization: Executes before first paint to prevent flash (FOUC) -->
    <script>
      (function() {
        var STORAGE_KEY = 'agentic-research-pro-theme';
        var theme = 'light';
        try {
          var stored = localStorage.getItem(STORAGE_KEY);
          if (stored === 'dark' || stored === 'light') {
            theme = stored;
          } else {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              theme = 'dark';
            }
          }
        } catch (e) {
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    
    <!-- Google Fonts: Space Grotesk, Instrument Serif, Inter, IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-research-bg text-research-primary antialiased selection:bg-research-blue/15 selection:text-research-primary min-h-screen min-h-dvh">
    <div id="root"></div>

  </body>
</html>
