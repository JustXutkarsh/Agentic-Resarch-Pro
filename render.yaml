services:
  - type: web
    name: agentic-research-pro
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: LLM_PROVIDER
        value: nvidia
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: TAVILY_API_KEY
        sync: false
      - key: PLAYWRIGHT_ENABLED
        value: "true"
      - key: PLAYWRIGHT_HEADLESS
        value: "true"
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: CORS_ALLOW_ORIGIN_REGEX
        value: "^https://.*\\.vercel\\.app$"
